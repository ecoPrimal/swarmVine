[workspace]
resolver = "2"
members = [
    "crates/swarmvine-core",
    "crates/swarmvine-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ecoPrimals/swarmVine"
authors = ["ecoPrimals Project"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Binary RPC (G64 cephalization — dual-protocol composition)
tarpc = { version = "0.37", features = ["tokio1", "serde-transport", "serde-transport-bincode", "unix", "tcp"] }
tokio-serde = { version = "0.9", features = ["bincode"] }
futures-util = "0.3"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
